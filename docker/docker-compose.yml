services:

  mysql:
    image: mysql:8.0
    container_name: ems-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 7218565867Pz@
      MYSQL_DATABASE: ems_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

  backend:
    build:
      context: ../backend/ems-backend
    container_name: ems-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ems_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 7218565867Pz@

    depends_on:
      - mysql

    restart: always
  frontend:
    build:
      context: ../frontend/ems-frontend
    container_name: ems-frontend

    ports:
     - "5173:80"

    depends_on:
     - backend

    restart: always

volumes:
  mysql_data: